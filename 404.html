<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      sessionStorage.setItem(
        "redirect",
        path.replace("/TouchPost", "") + search + hash,
      );

      window.location.replace("/TouchPost/");
    </script>
  </head>

  <body></body>
</html>
